  :root{
    --bg:#ffffff; --panel:#ffffff; --sidebar:#ffffff;
    --ink:#202124; --muted:#5f6368; --faint:#80868b;
    --border:#e0e0e0; --hover-row:#f2f6fc; --read-row:#f5f6f8;
    --compose-bg:#c2e7ff; --compose-ink:#001d35;
    --link:#1a73e8; --star:#f4b400;
    --g-red:#ea4335; --g-blue:#4285f4; --g-yellow:#f9ab00; --g-green:#34a853; --g-purple:#a142f4; --g-teal:#12b5cb;
    --shadow: 0 1px 2px 0 rgba(60,64,67,.3), 0 1px 3px 1px rgba(60,64,67,.15);
    --shadow-lg: 0 4px 6px 0 rgba(60,64,67,.2), 0 8px 24px 4px rgba(60,64,67,.15);
    --active-bg:#d3e3fd; --active-ink:#041e49;
    --font:'Roboto Var','Roboto',Arial,sans-serif;
    --ease: cubic-bezier(0.2,0,0,1);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#202124; --panel:#2d2e30; --sidebar:#1b1c1e;
      --ink:#e8eaed; --muted:#9aa0a6; --faint:#80868b;
      --border:#3c4043; --hover-row:#3c4043; --read-row:#26272a;
      --compose-bg:#a8c7fa; --compose-ink:#062e6f;
      --link:#8ab4f8; --star:#fdd663;
      --shadow: 0 1px 2px 0 rgba(0,0,0,.4), 0 1px 3px 1px rgba(0,0,0,.3);
      --shadow-lg: 0 4px 6px 0 rgba(0,0,0,.5), 0 8px 24px 4px rgba(0,0,0,.4);
      --active-bg:#41331c; --active-ink:#fdd663;
    }
  }
  :root[data-theme="dark"]{
    --bg:#202124; --panel:#2d2e30; --sidebar:#1b1c1e;
    --ink:#e8eaed; --muted:#9aa0a6; --faint:#80868b;
    --border:#3c4043; --hover-row:#3c4043; --read-row:#26272a;
    --compose-bg:#a8c7fa; --compose-ink:#062e6f;
    --link:#8ab4f8; --star:#fdd663;
    --shadow: 0 1px 2px 0 rgba(0,0,0,.4), 0 1px 3px 1px rgba(0,0,0,.3);
    --shadow-lg: 0 4px 6px 0 rgba(0,0,0,.5), 0 8px 24px 4px rgba(0,0,0,.4);
    --active-bg:#41331c; --active-ink:#fdd663;
  }
  :root[data-theme="light"]{
    --bg:#ffffff; --panel:#ffffff; --sidebar:#ffffff;
    --ink:#202124; --muted:#5f6368; --faint:#80868b;
    --border:#e0e0e0; --hover-row:#f2f6fc; --read-row:#f5f6f8;
    --compose-bg:#c2e7ff; --compose-ink:#001d35;
    --link:#1a73e8; --star:#f4b400;
    --shadow: 0 1px 2px 0 rgba(60,64,67,.3), 0 1px 3px 1px rgba(60,64,67,.15);
    --shadow-lg: 0 4px 6px 0 rgba(60,64,67,.2), 0 8px 24px 4px rgba(60,64,67,.15);
    --active-bg:#d3e3fd; --active-ink:#041e49;
  }

  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--font); font-size:14px; line-height:1.5;
    display:flex; flex-direction:column; overflow:hidden;
  }
  button{ font-family:inherit; }
  a{ color:var(--link); }
  svg{ display:block; flex:none; }
  :focus-visible{ outline:2px solid var(--link); outline-offset:2px; }

  /* ------------------------------------------------------------- topbar ---- */
  .topbar{
    height:64px; flex:none; display:flex; align-items:center; gap:1.25rem;
    padding-inline:1rem; border-bottom:1px solid var(--border);
  }
  .iconbtn{
    width:40px; height:40px; border-radius:50%; border:none; background:transparent;
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--muted);
    transition: background 150ms var(--ease);
  }
  .iconbtn:hover{ background:var(--hover-row); }
  .brand{ display:flex; align-items:center; gap:0.6rem; text-decoration:none; color:inherit; flex:none; }
  .brand svg{ width:30px; height:30px; }
  .brand span{ font-size:1.35rem; color:var(--muted); letter-spacing:-0.01em; }
  .searchwrap{ flex:1; max-width:720px; margin-inline:auto; position:relative; }
  .searchwrap input{
    width:100%; height:44px; border-radius:24px; border:none; background:var(--read-row);
    padding:0 1rem 0 3rem; font-size:0.95rem; color:var(--ink); outline:none;
  }
  .searchwrap input:focus{ background:var(--panel); box-shadow:var(--shadow); }
  .searchwrap svg{ position:absolute; left:14px; top:14px; width:18px; height:18px; color:var(--muted); }
  .avatar{
    width:32px; height:32px; border-radius:50%; flex:none;
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:500; font-size:0.85rem; cursor:pointer; border:none;
  }
  .accountwrap{ position:relative; }
  .account-menu{
    position:absolute; right:0; top:44px; background:var(--panel); box-shadow:var(--shadow-lg);
    border-radius:12px; padding:0.5rem; min-width:220px; max-width:calc(100vw - 1.5rem);
    display:none; z-index:40;
  }
  .account-menu.open{ display:block; }
  .account-menu a, .account-menu button{
    display:flex; align-items:center; gap:0.6rem; width:100%; text-align:left;
    padding:0.6rem 0.8rem; border-radius:8px; border:none; background:none; color:var(--ink);
    text-decoration:none; font-size:0.88rem; cursor:pointer;
  }
  .account-menu a:hover, .account-menu button:hover{ background:var(--hover-row); }

  /* --------------------------------------------------------------- shell ---- */
  .shell{ flex:1; display:flex; min-height:0; }

  /* ------------------------------------------------------------- sidebar ---- */
  .sidebar{
    width:256px; flex:none; padding:1rem 0.5rem; overflow-y:auto;
    background:var(--sidebar); border-right:1px solid transparent;
  }
  .compose-btn{
    display:flex; align-items:center; gap:0.9rem; background:var(--compose-bg); color:var(--compose-ink);
    border:none; border-radius:16px; padding:0.9rem 1.4rem; font-size:0.95rem; font-weight:500;
    box-shadow:var(--shadow); cursor:pointer; margin:0 0.5rem 1.25rem;
    transition: box-shadow 150ms var(--ease), transform 150ms var(--ease);
  }
  .compose-btn:hover{ box-shadow:var(--shadow-lg); }
  .compose-btn:active{ transform:scale(0.98); }
  .compose-btn svg{ width:20px; height:20px; }

  .navitem{
    display:flex; align-items:center; gap:1rem; width:100%; border:none; background:none;
    padding:0.55rem 1.25rem 0.55rem 1.5rem; border-radius:0 20px 20px 0; margin-right:0.5rem;
    color:var(--ink); font-size:0.87rem; cursor:pointer; text-align:left;
  }
  .navitem svg{ width:18px; height:18px; color:var(--muted); flex:none; }
  .navitem .count{ margin-left:auto; font-weight:500; color:var(--muted); font-size:0.82rem; }
  .navitem:hover{ background:var(--hover-row); }
  .navitem.active{ background:var(--active-bg); color:var(--active-ink); font-weight:700; }
  .navitem.active svg{ color:inherit; }

  .navdivider{ height:1px; background:var(--border); margin:0.75rem 1rem; }
  .navlabel-head{ padding:0.4rem 1.5rem; font-size:0.72rem; letter-spacing:0.04em; color:var(--faint); text-transform:uppercase; }
  .label-dot{ width:10px; height:10px; border-radius:2px; flex:none; }

  .storage{ margin:1.5rem 1.25rem 0; }
  .storage-bar{ height:4px; background:var(--border); border-radius:2px; overflow:hidden; }
  .storage-bar > div{ height:100%; background:var(--link); width:100%; }
  .storage p{ margin:0.5rem 0 0; font-size:0.72rem; color:var(--faint); }

  /* --------------------------------------------------------------- main ---- */

      var fromLabel = e.isSent ? ('To: ' + e.from) : e.from;
      row.innerHTML =
        '<button class="star ' + (e.starred ? 'on' : '') + '" data-star="' + e.id + '" aria-label="Star">' +
          '<svg viewBox="0 0 24 24"><use href="#ic-star"/></svg>' +
        '</button>' +
        '<span class="avatar" style="background:' + e.avatarColor + '">' + e.avatarLetter + '</span>' +
        '<span class="rowmain">' +
          '<span class="line1">' +
            '<span class="from">' + fromLabel + '</span>' +
            '<span class="label-chip" style="background:' + e.labelColor + '">' + e.label + '</span>' +
          '</span>' +
          '<span class="snippetline"><span class="subject">' + e.subject + '</span> — ' + e.snippet + '</span>' +
        '</span>' +
        '<span class="date">' + e.date + '</span>';
      row.addEventListener('click', function(ev){
        if (ev.target.closest('[data-star]')) return;
        openEmail(e.id);
      });
      listEl.appendChild(row);
    });
    listCount.textContent = list.length ? ('1–' + list.length + ' of ' + list.length) : '';
    listEl.querySelectorAll('[data-star]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-star');
        var em = emails.find(function(x){ return x.id === id; });
        em.starred = !em.starred;
        renderList();
      });
    });
  }

  function openEmail(id){
    var e = emails.find(function(x){ return x.id === id; });
    if (!e) return;
    e.unread = false;
    state.activeId = id;
    updateInboxCount();
    renderList();

    var linkHtml = e.link ? ('<a class="read-link-btn" href="' + e.link + '" target="_blank" rel="noopener">' + (e.linkLabel || 'Open link') + '</a>') : '';
    readcol.innerHTML =
      '<div class="readwrap">' +
        '<button class="backbtn iconbtn" id="backBtn" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24"><use href="#ic-back"/></svg></button>' +
        '<span class="read-labelchip" style="background:' + e.labelColor + '">' + e.label + '</span>' +
        '<h1 class="read-subject">' + e.subject + '</h1>' +
        '<div class="read-meta">' +
          '<span class="avatar" style="background:' + e.avatarColor + '">' + e.avatarLetter + '</span>' +
          '<span class="who"><b>' + (e.isSent ? 'You' : e.from) + '</b><br/><span class="addr">to ' + (e.isSent ? e.from : 'you') + '</span></span>' +
          '<span class="when">' + e.date + '</span>' +
        '</div>' +
        '<div class="read-body">' + e.body.map(function(p){ return '<p>' + p + '</p>'; }).join('') + linkHtml + '</div>' +
        '<div class="read-actions">' +
          '<button class="action-btn" data-reply>Reply</button>' +
          '<button class="action-btn" data-reply>Forward</button>' +
        '</div>' +
      '</div>';
    readcol.querySelectorAll('[data-reply]').forEach(function(b){
      b.addEventListener('click', function(){ window.open(LINKEDIN_URL, '_blank'); });
    });
    var back = document.getElementById('backBtn');
    if (back) back.addEventListener('click', function(){ maincol.classList.remove('showing-read'); });
    maincol.classList.add('showing-read');
  }

  document.querySelectorAll('.navitem').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.navitem').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      state.query = '';
      document.getElementById('searchInput').value = '';
      if (btn.dataset.folder){
        state.folder = btn.dataset.folder; state.label = null;
        listTitle.textContent = btn.querySelector('span').textContent;
      } else if (btn.dataset.label){
        state.label = btn.dataset.label; state.folder = null;
        listTitle.textContent = btn.dataset.label;
      }
      renderList();
      closeDrawer();
    });
  });

  document.getElementById('searchInput').addEventListener('input', function(e){
    state.query = e.target.value;
    listTitle.textContent = state.query ? ('Search results') : 'Inbox';
    renderList();
  });

  document.getElementById('logoHome').addEventListener('click', function(ev){
    ev.preventDefault();
    document.querySelectorAll('.navitem').forEach(function(b){ b.classList.remove('active'); });
    document.querySelector('[data-folder="inbox"]').classList.add('active');
    state.folder = 'inbox'; state.label = null; state.query = '';
    document.getElementById('searchInput').value = '';
    listTitle.textContent = 'Inbox';
    renderList();
  });

  /* account menu */
  var accountBtn = document.getElementById('accountBtn');
  var accountMenu = document.getElementById('accountMenu');
  accountBtn.addEventListener('click', function(){ accountMenu.classList.toggle('open'); });
  document.addEventListener('click', function(ev){
    if (!ev.target.closest('.accountwrap')) accountMenu.classList.remove('open');
  });

  /* sidebar: a real slide-in drawer on phones, an icon-rail toggle on desktop */
  var sidebar = document.getElementById('sidebar');
  function isPhone(){ return window.matchMedia('(max-width:760px)').matches; }
  function closeDrawer(){
    if (isPhone()){ sidebar.classList.remove('drawer-open'); backdrop.classList.remove('open'); }
  }
  document.getElementById('menuToggle').addEventListener('click', function(){
    if (isPhone()){
      closeCompose();
      sidebar.classList.toggle('drawer-open');
      backdrop.classList.toggle('open', sidebar.classList.contains('drawer-open'));
    } else {
      sidebar.classList.toggle('collapsed-force');
    }
  });

  /* compose modal */
  var composeModal = document.getElementById('composeModal');
  var backdrop = document.getElementById('backdrop');
  function openCompose(){
    closeDrawer(); // the drawer sits in front of the modal on phones — never leave both open
    composeModal.classList.add('open');
    backdrop.classList.add('open');
    accountMenu.classList.remove('open');
  }
  function closeCompose(){ composeModal.classList.remove('open'); backdrop.classList.remove('open'); }
  document.getElementById('composeBtn').addEventListener('click', openCompose);
  document.getElementById('composeFromMenu').addEventListener('click', openCompose);
  document.getElementById('fabCompose').addEventListener('click', openCompose);
  document.getElementById('composeClose').addEventListener('click', closeCompose);
  document.getElementById('sendBtn').addEventListener('click', function(){
    window.open(LINKEDIN_URL, '_blank');
    closeCompose();
  });
  backdrop.addEventListener('click', function(){
    closeCompose();
    closeDrawer();
  });

  updateInboxCount();
  renderList();
})();
</script>
